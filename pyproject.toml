[project]
name = "mirror"
version = "0.1.0"
description = "MIRROR: Zero-shot prediction of spatial immune profiles from routine pathology slides using a vision–language model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "pillow>=10",
    "tqdm>=4.65",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mirror*"]

[tool.setuptools]
py-modules = []
